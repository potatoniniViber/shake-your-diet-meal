<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍀 幸运食谱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #fdf6f0; min-height: 100vh; display: flex; justify-content: center; padding: 20px 16px 40px; }
        .app { max-width: 420px; width: 100%; background: #ffffff; border-radius: 36px; box-shadow: 0 12px 40px rgba(210,140,100,0.15); padding: 24px 20px 30px; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #3d2c1e;
        }
        .header h1 span { color: #e67e22; }
        .date-display {
            font-size: 14px;
            color: #7a4a2e;
            background: #f5ebe4;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: 500;
            white-space: nowrap;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .export-icon, .settings-icon {
            font-size: 22px;
            cursor: pointer;
            background: #f5ebe4;
            padding: 4px 10px;
            border-radius: 30px;
            transition: 0.15s;
            border: none;
            line-height: 1;
        }
        .export-icon:active, .settings-icon:active { transform: scale(0.92); }

        .target-cal { background: #f5ebe4; padding: 6px 14px; border-radius: 30px; font-size: 14px; font-weight: 600; color: #7a4a2e; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 10px; }
        .target-cal strong { color: #d35400; cursor: pointer; border-bottom: 1px dashed #d35400; padding: 0 2px; }
        .target-cal strong:hover { background: #f0e3da; border-radius: 4px; }
        .edit-hint { font-size: 11px; color: #a9846a; font-weight: 400; }
        .shake-btn-wrap { display: flex; flex-direction: column; align-items: stretch; gap: 8px; margin: 8px 0 18px; }
        #shakeBtn { background: linear-gradient(145deg, #f39c12, #e67e22); border: none; color: white; font-size: 18px; font-weight: 700; padding: 14px 20px; border-radius: 60px; box-shadow: 0 8px 20px rgba(230,126,34,0.35); display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; transition: all 0.15s; border: 1px solid rgba(255,255,255,0.2); }
        #shakeBtn:active { transform: scale(0.94); }
        #shakeBtn:disabled { opacity: 0.6; pointer-events: none; }
        .shake-icon { display: inline-block; transition: transform 0.2s; }
        .shaking .shake-icon { animation: diceRoll 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
        @keyframes diceRoll { 0% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(20deg) scale(1.2); } 50% { transform: rotate(-20deg) scale(0.9); } 75% { transform: rotate(10deg) scale(1.1); } 100% { transform: rotate(0deg) scale(1); } }
        .shake-total { font-size: 15px; background: rgba(255,255,255,0.25); padding: 2px 14px; border-radius: 30px; font-weight: 600; }
        .meal-grid { display: flex; flex-direction: column; gap: 14px; margin: 14px 0 18px; min-height: 340px; }
        .meal-card { background: #fcf8f5; border-radius: 20px; padding: 14px 18px; border: 1px solid #f0e3da; position: relative; }
        .meal-card.fixed { border-color: #e67e22; background: #fdf6f0; }
        .meal-card .meal-tag { font-size: 12px; font-weight: 700; color: white; background: #b8957a; padding: 2px 14px; border-radius: 30px; display: inline-block; margin-bottom: 6px; }
        .meal-card .meal-tag.breakfast { background: #e67e22; }
        .meal-card .meal-tag.lunch { background: #d35400; }
        .meal-card .meal-tag.dinner { background: #7f8c8d; }
        .meal-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .meal-name { font-size: 17px; font-weight: 650; color: #2c1f14; }
        .meal-cal { font-size: 15px; font-weight: 600; color: #d35400; background: #f0e3da; padding: 1px 12px; border-radius: 30px; }
        .fix-btn { background: transparent; border: none; font-size: 22px; cursor: pointer; padding: 0 4px; transition: 0.1s; line-height: 1; }
        .fix-btn.active { color: #e74c3c; text-shadow: 0 0 8px rgba(231,76,60,0.3); }
        .fix-btn:active { transform: scale(0.9); }
        .recipe-detail { margin-top: 6px; padding-top: 8px; border-top: 1px dashed #e6d6cc; }
        .recipe-detail .ingredients { font-size: 13px; color: #3d2c1e; background: #f5eee9; padding: 6px 12px; border-radius: 12px; margin-bottom: 6px; }
        .recipe-detail .ingredients strong { color: #d35400; }
        .recipe-detail .method { font-size: 13px; color: #5f4b3c; padding: 4px 8px; background: #fff; border-radius: 8px; border-left: 3px solid #e67e22; }
        .recipe-detail .method strong { color: #2c1f14; }
        .summary { background: #f5ebe4; border-radius: 24px; padding: 16px 18px; margin-top: 8px; }
        .cal-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .cal-progress .label { font-size: 14px; font-weight: 600; color: #4a3426; white-space: nowrap; }
        .progress-bar-bg { flex: 1; height: 8px; background: #ddd0c6; border-radius: 20px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f1c40f, #e67e22); border-radius: 20px; transition: width 0.4s ease; }
        .cal-numbers { font-size: 15px; font-weight: 700; color: #2c1f14; min-width: 72px; text-align: right; }
        .macro-row { display: flex; justify-content: space-around; gap: 6px; }
        .macro-item { text-align: center; flex: 1; background: white; border-radius: 40px; padding: 6px 0; font-size: 13px; font-weight: 500; color: #3d2c1e; }
        .macro-item .num { font-weight: 700; font-size: 15px; }
        .macro-item .num.p { color: #2980b9; }
        .macro-item .num.c { color: #27ae60; }
        .macro-item .num.f { color: #e67e22; }
        .status-tip { text-align: center; font-size: 13px; color: #7f6b5c; margin: 6px 0 2px; min-height: 20px; }
        .status-tip.success { color: #27ae60; font-weight: 600; }
        .status-tip.danger { color: #e74c3c; font-weight: 600; }
        .fixed-info { margin-top: 12px; border-top: 2px dashed #e6d6cc; padding-top: 12px; font-size: 14px; color: #7a4a2e; display: flex; justify-content: center; }
        @media (max-width: 400px) { .app { padding: 18px 14px; } .meal-name { font-size: 15px; } }

        .settings-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .settings-overlay.active { display: flex; }
        .settings-panel {
            background: #fff;
            border-radius: 32px;
            padding: 28px 24px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .settings-panel h2 { font-size: 20px; margin-bottom: 16px; color: #3d2c1e; text-align: center; }
        .settings-group { margin-bottom: 16px; border-bottom: 1px solid #eee; padding-bottom: 12px; }
        .settings-group:last-of-type { border-bottom: none; }
        .settings-group .meal-label { font-weight: 600; font-size: 16px; color: #3d2c1e; display: block; margin-bottom: 8px; }
        .settings-options { display: flex; gap: 8px; flex-wrap: wrap; }
        .settings-option { flex: 1; min-width: 60px; padding: 8px 12px; border-radius: 40px; background: #f5ebe4; text-align: center; cursor: pointer; transition: 0.15s; border: 2px solid transparent; font-size: 14px; font-weight: 500; color: #3d2c1e; }
        .settings-option.active { border-color: #e67e22; background: #fdf6f0; }
        .settings-option input { display: none; }
        .settings-option label { cursor: pointer; display: block; }
        .settings-actions { margin-top: 16px; display: flex; gap: 10px; justify-content: center; }
        .settings-btn { padding: 10px 20px; border: none; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.15s; }
        .settings-btn:active { transform: scale(0.96); }
        .settings-btn.primary { background: #e67e22; color: white; flex: 1; }
        .settings-btn.all-unlimited { background: #d4c5b8; color: #3d2c1e; flex: 0 0 auto; }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="header">
        <div class="header-left">
            <h1>🍀 幸运<span>食谱</span></h1>
            <div class="date-display" id="dateDisplay"></div>
        </div>
        <div class="header-actions">
            <button class="settings-icon" id="settingsBtn" title="设置每餐来源">⚙️</button>
            <button class="export-icon" id="exportBtn" title="导出已吃记录">📤</button>
        </div>
    </div>

    <div class="target-cal">
        🎯 目标 <strong id="targetDisplay">1500</strong> kcal
        <span class="edit-hint">✎ 点击修改</span>
    </div>

    <div class="shake-btn-wrap">
        <button id="shakeBtn">
            <span class="shake-icon">🎲</span> 摇一摇 · 今日幸运
            <span class="shake-total" id="shakeTotal">0 kcal</span>
        </button>
    </div>

    <div class="meal-grid" id="mealGrid"></div>

    <div class="summary">
        <div class="cal-progress">
            <span class="label">🔥 已固定总热量</span>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="calFill" style="width:0%"></div></div>
            <span class="cal-numbers" id="calDisplay">0 / 1500</span>
        </div>
        <div class="macro-row">
            <div class="macro-item">🥩 蛋白 <span class="num p" id="proteinDisplay">0</span>g</div>
            <div class="macro-item">🍚 碳水 <span class="num c" id="carbsDisplay">0</span>g</div>
            <div class="macro-item">🧈 脂肪 <span class="num f" id="fatDisplay">0</span>g</div>
        </div>
    </div>
    <div class="status-tip" id="statusTip">👆 点击❤️固定餐点，再次点击取消</div>

    <div class="fixed-info">
        <span>❤️ 已固定：<span id="fixedCount">0</span> 餐</span>
    </div>
</div>

<!-- 设置弹窗 -->
<div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">
        <h2>⚙️ 每餐来源设置</h2>
        <div class="settings-group">
            <span class="meal-label">🌅 早餐</span>
            <div class="settings-options" data-meal="breakfast">
                <div class="settings-option active" data-value="all"><input type="radio" name="source_breakfast" value="all" id="src_breakfast_all" checked><label for="src_breakfast_all">不限</label></div>
                <div class="settings-option" data-value="homemade"><input type="radio" name="source_breakfast" value="homemade" id="src_breakfast_homemade"><label for="src_breakfast_homemade">自制</label></div>
                <div class="settings-option" data-value="takeout"><input type="radio" name="source_breakfast" value="takeout" id="src_breakfast_takeout"><label for="src_breakfast_takeout">外卖</label></div>
            </div>
        </div>
        <div class="settings-group">
            <span class="meal-label">☀️ 午餐</span>
            <div class="settings-options" data-meal="lunch">
                <div class="settings-option active" data-value="all"><input type="radio" name="source_lunch" value="all" id="src_lunch_all" checked><label for="src_lunch_all">不限</label></div>
                <div class="settings-option" data-value="homemade"><input type="radio" name="source_lunch" value="homemade" id="src_lunch_homemade"><label for="src_lunch_homemade">自制</label></div>
                <div class="settings-option" data-value="takeout"><input type="radio" name="source_lunch" value="takeout" id="src_lunch_takeout"><label for="src_lunch_takeout">外卖</label></div>
            </div>
        </div>
        <div class="settings-group">
            <span class="meal-label">🌙 晚餐</span>
            <div class="settings-options" data-meal="dinner">
                <div class="settings-option active" data-value="all"><input type="radio" name="source_dinner" value="all" id="src_dinner_all" checked><label for="src_dinner_all">不限</label></div>
                <div class="settings-option" data-value="homemade"><input type="radio" name="source_dinner" value="homemade" id="src_dinner_homemade"><label for="src_dinner_homemade">自制</label></div>
                <div class="settings-option" data-value="takeout"><input type="radio" name="source_dinner" value="takeout" id="src_dinner_takeout"><label for="src_dinner_takeout">外卖</label></div>
            </div>
        </div>
        <div class="settings-actions">
            <button class="settings-btn all-unlimited" id="setAllUnlimited">🌐 全部不限</button>
            <button class="settings-btn primary" id="settingsSave">确认保存</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 完整食物库（三餐各50道，共150道）
    // ============================================================
    const MEAL_DATA = {

            { id: 'b2', name: '全麦鸡蛋三明治', calories: 350, protein: 18, carbs: 32, fat: 14, ingredients: '全麦面包2片(60g)，鸡蛋1个(50g)，生菜20g，低脂沙拉酱5g', method: '鸡蛋煎熟，夹入生菜和酱料，对半切开。', source: 'homemade' },
            { id: 'b3', name: '蒸红薯+水煮蛋', calories: 290, protein: 11, carbs: 46, fat: 5, ingredients: '红薯200g，鸡蛋1个(50g)', method: '红薯蒸20分钟，鸡蛋冷水下锅煮8分钟，剥壳对半切。', source: 'homemade' },

            { id: 'b5', name: '玉米+热牛奶', calories: 310, protein: 10, carbs: 38, fat: 12, ingredients: '甜玉米1根(约200g)，低脂牛奶250ml', method: '玉米蒸熟或水煮15分钟，牛奶微波加热1分钟。', source: 'homemade' },
            { id: 'b6', name: '荞麦凉面', calories: 340, protein: 14, carbs: 48, fat: 8, ingredients: '干荞麦面60g，鸡蛋1个(50g)，黄瓜丝30g，生抽+醋+小米辣调汁', method: '荞麦面煮4分钟过凉水，蛋皮切丝，浇上酱汁拌匀。', source: 'homemade' },
            { id: 'b7', name: '紫薯+豆浆', calories: 270, protein: 12, carbs: 42, fat: 4, ingredients: '小紫薯2个(共150g)，无糖豆浆250ml', method: '紫薯蒸20分钟，豆浆加热后搭配饮用。', source: 'homemade' },
            { id: 'b8', name: '蔬菜蛋饼', calories: 300, protein: 16, carbs: 18, fat: 16, ingredients: '鸡蛋2个(100g)，西葫芦丝50g，胡萝卜丝30g，全麦粉20g', method: '所有食材混合搅匀，平底锅少油煎至两面金黄。', source: 'homemade' },
            { id: 'b9', name: '奇亚籽布丁', calories: 260, protein: 9, carbs: 20, fat: 15, ingredients: '奇亚籽20g，椰奶150ml，芒果丁40g', method: '奇亚籽+椰奶冷藏过夜，取出铺上芒果丁。', source: 'homemade' },

            { id: 'b23', name: '蒸蛋羹', calories: 90, protein: 8, carbs: 3, fat: 5, ingredients: '鸡蛋2个，温水150ml，盐', method: '鸡蛋打散加温水过筛，蒸10分钟。', source: 'homemade' },
            { id: 'b24', name: '凉拌萝卜丝', calories: 30, protein: 1, carbs: 6, fat: 0.5, ingredients: '白萝卜200g，盐，醋', method: '萝卜切丝，盐腌10分钟挤水，加醋拌匀。', source: 'homemade' },
            { id: 'b25', name: '水果拼盘', calories: 120, protein: 1, carbs: 30, fat: 0.5, ingredients: '苹果100g，橙子100g，草莓50g', method: '水果洗净切块装盘。', source: 'homemade' },
            { id: 'b26', name: '绿豆汤', calories: 60, protein: 2, carbs: 14, fat: 0.3, ingredients: '绿豆50g，水500ml，冰糖5g', method: '绿豆煮至开花，加冰糖调味。', source: 'homemade' },

    // ============================================================
    // 状态与逻辑（完整无删减）
    // ============================================================
    let TARGET_CAL = 1500;
    let fixed = { breakfast: null, lunch: null, dinner: null };
    let currentMeals = { breakfast: null, lunch: null, dinner: null };
    let mealSource = { breakfast: 'all', lunch: 'all', dinner: 'all' };

    const grid = document.getElementById('mealGrid');
    const shakeBtn = document.getElementById('shakeBtn');
    const shakeTotal = document.getElementById('shakeTotal');
    const calFill = document.getElementById('calFill');
    const calDisplay = document.getElementById('calDisplay');
    const proteinDisplay = document.getElementById('proteinDisplay');
    const carbsDisplay = document.getElementById('carbsDisplay');
    const fatDisplay = document.getElementById('fatDisplay');
    const statusTip = document.getElementById('statusTip');
    const targetDisplay = document.getElementById('targetDisplay');
    const dateDisplay = document.getElementById('dateDisplay');
    const fixedCount = document.getElementById('fixedCount');
    const exportBtn = document.getElementById('exportBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsOverlay = document.getElementById('settingsOverlay');
    const settingsSave = document.getElementById('settingsSave');
    const setAllUnlimited = document.getElementById('setAllUnlimited');

    function pickRandomFromArray(arr) {
        if (!arr || arr.length === 0) return null;
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function getAvailableMeals(type) {
        const all = MEAL_DATA[type];
        if (!all) return [];
        const filter = mealSource[type] || 'all';
        if (filter === 'all') return all;
        return all.filter(item => item.source === filter);
    }

    function resetFixed() {
        fixed = { breakfast: null, lunch: null, dinner: null };
        localStorage.removeItem('fixedMeals');
    }

    function saveFixed() {
        const toSave = {};
        ['breakfast', 'lunch', 'dinner'].forEach(type => {
            toSave[type] = fixed[type] ? fixed[type].id : null;
        });
        localStorage.setItem('fixedMeals', JSON.stringify(toSave));
    }

    function updateFixedCount() {
        let count = 0;
        if (fixed.breakfast) count++;
        if (fixed.lunch) count++;
        if (fixed.dinner) count++;
        fixedCount.textContent = count;
    }

    function calculateFixedTotals() {
        const meals = [fixed.breakfast, fixed.lunch, fixed.dinner];
        let totalCal = 0, protein = 0, carbs = 0, fat = 0;
        meals.forEach(m => {
            if (m) {
                totalCal += m.calories;
                protein += m.protein || 0;
                carbs += m.carbs || 0;
                fat += m.fat || 0;
            }
        });
        return { totalCal, protein, carbs, fat };
    }

    function calculateDisplayTotals() {
        const meals = [currentMeals.breakfast, currentMeals.lunch, currentMeals.dinner];
        let totalCal = 0;
        meals.forEach(m => { if (m) totalCal += m.calories; });
        return totalCal;
    }

    function renderCards() {
        const types = ['breakfast', 'lunch', 'dinner'];
        const labels = { breakfast: '🌅 早餐', lunch: '☀️ 午餐', dinner: '🌙 晚餐' };
        const tagClasses = { breakfast: 'breakfast', lunch: 'lunch', dinner: 'dinner' };

        let html = '';
        let anyMeal = false;
        types.forEach(type => {
            const data = currentMeals[type];
            if (!data) {
                html += `
                    <div class="meal-card" style="background:#f9f3ee; border-color:#ddd;">
                        <div class="meal-header">
                            <span class="meal-tag ${tagClasses[type]}">${labels[type]}</span>
                            <span style="color:#aaa; font-size:14px;">暂无匹配菜品</span>
                        </div>
                        <div style="padding:10px 0; color:#999; font-size:13px;">请检查来源设置或点击摇一摇</div>
                    </div>
                `;
                return;
            }
            anyMeal = true;
            const isFixed = (fixed[type] && fixed[type].id === data.id);
            html += `
                <div class="meal-card ${isFixed ? 'fixed' : ''}" data-type="${type}">
                    <div class="meal-header">
                        <span class="meal-tag ${tagClasses[type]}">${labels[type]}</span>
                        <button class="fix-btn ${isFixed ? 'active' : ''}" data-type="${type}" data-id="${data.id}">${isFixed ? '❤️' : '♡'}</button>
                    </div>
                    <div class="meal-header" style="margin-top:2px;">
                        <span class="meal-name">${data.name}</span>
                        <span class="meal-cal">${data.calories} kcal</span>
                    </div>
                    <div class="recipe-detail">
                        <div class="ingredients"><strong>🛒 食材：</strong>${data.ingredients}</div>
                        <div class="method"><strong>👨‍🍳 做法：</strong>${data.method}</div>
                    </div>
                </div>
            `;
        });
        grid.innerHTML = html;

        if (!anyMeal) {
            grid.innerHTML = `<div style="text-align:center;padding:30px 0;color:#aaa;">暂无菜品，请检查数据或设置</div>`;
        }

        document.querySelectorAll('.fix-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const type = this.dataset.type;
                const id = this.dataset.id;
                toggleFix(type, id);
            });
        });
    }

    function toggleFix(type, id) {
        if (fixed[type] && fixed[type].id === id) {
            fixed[type] = null;
        } else {
            const mealData = currentMeals[type];
            if (!mealData) return;
            fixed[type] = { ...mealData };
        }
        if (fixed[type]) {
            currentMeals[type] = { ...fixed[type] };
        }
        renderAll();
        saveFixed();
    }

    function updateSummary() {
        const { totalCal, protein, carbs, fat } = calculateFixedTotals();
        const percent = Math.min((totalCal / TARGET_CAL) * 100, 100);
        calFill.style.width = percent + '%';
        calDisplay.textContent = `${totalCal} / ${TARGET_CAL}`;
        proteinDisplay.textContent = protein;
        carbsDisplay.textContent = carbs;
        fatDisplay.textContent = fat;

        if (totalCal === 0) {
            statusTip.className = 'status-tip';
            statusTip.textContent = '👆 点击❤️固定餐点，再次点击取消';
        } else if (totalCal <= TARGET_CAL) {
            statusTip.className = 'status-tip success';
            statusTip.textContent = '✅ 固定餐点总热量在目标范围内';
        } else {
            statusTip.className = 'status-tip danger';
            statusTip.textContent = `❌ 固定餐点超目标 ${totalCal - TARGET_CAL} kcal，请取消部分固定`;
        }
    }

    function updateShakeTotal() {
        const total = calculateDisplayTotals();
        shakeTotal.textContent = `${total} kcal`;
    }

    function renderAll() {
        renderCards();
        updateSummary();
        updateShakeTotal();
        updateFixedCount();
    }

    function generateValidCombination() {
        const types = ['breakfast', 'lunch', 'dinner'];
        let attempts = 0;
        const maxAttempts = 150;
        let best = null;
        let bestTotal = Infinity;

        while (attempts < maxAttempts) {
            attempts++;
            let temp = {};
            let valid = true;
            for (let t of types) {
                if (fixed[t]) {
                    temp[t] = { ...fixed[t] };
                } else {
                    const candidates = getAvailableMeals(t);
                    if (candidates.length === 0) {
                        valid = false;
                        break;
                    }
                    const picked = pickRandomFromArray(candidates);
                    if (!picked) {
                        valid = false;
                        break;
                    }
                    temp[t] = picked;
                }
            }
            if (!valid) continue;
            const total = temp.breakfast.calories + temp.lunch.calories + temp.dinner.calories;
            if (total <= TARGET_CAL) {
                return { meals: temp, total, found: true };
            }
            if (total < bestTotal) {
                bestTotal = total;
                best = temp;
            }
        }
        if (best) {
            return { meals: best, total: bestTotal, found: false };
        } else {
            let fallback = {};
            for (let t of types) {
                if (fixed[t]) {
                    fallback[t] = { ...fixed[t] };
                } else {
                    const candidates = getAvailableMeals(t);
                    fallback[t] = candidates.length ? candidates[0] : null;
                }
            }
            const total = (fallback.breakfast ? fallback.breakfast.calories : 0) +
                          (fallback.lunch ? fallback.lunch.calories : 0) +
                          (fallback.dinner ? fallback.dinner.calories : 0);
            return { meals: fallback, total, found: false };
        }
    }

    function shakeAndGenerate() {
        shakeBtn.disabled = true;
        shakeBtn.classList.add('shaking');
        setTimeout(() => {
            const res = generateValidCombination();
            currentMeals = res.meals;
            renderAll();
            if (!res.found) {
                statusTip.className = 'status-tip danger';
                statusTip.textContent = `⚠️ 无法在目标内组合，当前总热量 ${res.total} kcal，请调整设置或取消固定`;
            } else {
                statusTip.className = 'status-tip success';
                statusTip.textContent = '✅ 已生成符合目标的组合！';
            }
            shakeBtn.classList.remove('shaking');
            shakeBtn.disabled = false;
        }, 400);
    }

    function editTargetCalorie() {
        const input = prompt('请输入新的每日热量目标（kcal）：', TARGET_CAL);
        if (input === null) return;
        const newVal = parseInt(input.trim());
        if (isNaN(newVal) || newVal < 100) {
            alert('请输入有效的数字（≥100）');
            return;
        }
        TARGET_CAL = newVal;
        targetDisplay.textContent = TARGET_CAL;
        localStorage.setItem('targetCal', TARGET_CAL);
        if (calculateDisplayTotals() > TARGET_CAL) {
            const res = generateValidCombination();
            currentMeals = res.meals;
            renderAll();
            if (!res.found) {
                statusTip.className = 'status-tip danger';
                statusTip.textContent = `⚠️ 新目标下无法满足，当前总热量 ${res.total} kcal，请调整设置`;
            } else {
                statusTip.className = 'status-tip success';
                statusTip.textContent = `✅ 已自动调整至新目标 (${TARGET_CAL} kcal)`;
            }
        } else {
            updateSummary();
            updateShakeTotal();
        }
    }

    function exportData() {
        const now = new Date();
        const dateStr = now.toISOString().slice(0,10);

        const breakfast = fixed.breakfast ? `${fixed.breakfast.name} ${fixed.breakfast.calories}kcal` : '-';
        const lunch = fixed.lunch ? `${fixed.lunch.name} ${fixed.lunch.calories}kcal` : '-';
        const dinner = fixed.dinner ? `${fixed.dinner.name} ${fixed.dinner.calories}kcal` : '-';
        const total = (fixed.breakfast ? fixed.breakfast.calories : 0) +
                      (fixed.lunch ? fixed.lunch.calories : 0) +
                      (fixed.dinner ? fixed.dinner.calories : 0);

        const header = '日期,早餐,午餐,晚餐,总热量';
        const row = `${dateStr},${breakfast},${lunch},${dinner},${total}kcal`;
        const content = header + '\n' + row;

        const blob = new Blob(['\uFEFF' + content], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `已吃记录_${dateStr}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function loadMealSources() {
        const saved = localStorage.getItem('mealSources');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (parsed.breakfast && ['all','homemade','takeout'].includes(parsed.breakfast)) mealSource.breakfast = parsed.breakfast;
                if (parsed.lunch && ['all','homemade','takeout'].includes(parsed.lunch)) mealSource.lunch = parsed.lunch;
                if (parsed.dinner && ['all','homemade','takeout'].includes(parsed.dinner)) mealSource.dinner = parsed.dinner;
            } catch(e) { /* ignore */ }
        }
    }

    function saveMealSources() {
        localStorage.setItem('mealSources', JSON.stringify(mealSource));
    }

    function syncSettingsUI() {
        ['breakfast', 'lunch', 'dinner'].forEach(type => {
            const container = document.querySelector(`.settings-options[data-meal="${type}"]`);
            if (!container) return;
            const options = container.querySelectorAll('.settings-option');
            options.forEach(opt => {
                const val = opt.dataset.value;
                const radio = opt.querySelector('input[type="radio"]');
                if (radio) {
                    radio.checked = (val === mealSource[type]);
                }
                opt.classList.toggle('active', val === mealSource[type]);
            });
        });
    }

    function applySettingsFromUI() {
        ['breakfast', 'lunch', 'dinner'].forEach(type => {
            const container = document.querySelector(`.settings-options[data-meal="${type}"]`);
            if (!container) return;
            const selected = container.querySelector('.settings-option.active input[type="radio"]');
            if (selected) {
                mealSource[type] = selected.value;
            }
        });
        saveMealSources();
        const res = generateValidCombination();
        currentMeals = res.meals;
        renderAll();
        if (!res.found) {
            statusTip.className = 'status-tip danger';
            statusTip.textContent = `⚠️ 当前设置下无法满足目标，请调整设置或取消固定`;
        } else {
            statusTip.className = 'status-tip success';
            statusTip.textContent = `✅ 已根据新设置重新生成`;
        }
    }

    function setAllUnlimitedClick() {
        mealSource = { breakfast: 'all', lunch: 'all', dinner: 'all' };
        saveMealSources();
        syncSettingsUI();
        const res = generateValidCombination();
        currentMeals = res.meals;
        renderAll();
        if (!res.found) {
            statusTip.className = 'status-tip danger';
            statusTip.textContent = `⚠️ 全部不限下无法满足目标，请调整设置或取消固定`;
        } else {
            statusTip.className = 'status-tip success';
            statusTip.textContent = `✅ 已切换为全部不限并重新生成`;
        }
        settingsOverlay.classList.remove('active');
    }

    function init() {
        resetFixed();
        loadMealSources();
        syncSettingsUI();

        const savedTarget = localStorage.getItem('targetCal');
        if (savedTarget) {
            const val = parseInt(savedTarget);
            if (!isNaN(val) && val >= 100) TARGET_CAL = val;
        }
        targetDisplay.textContent = TARGET_CAL;

        const now = new Date();
        dateDisplay.textContent = now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });

        const initial = generateValidCombination();
        currentMeals = initial.meals;
        renderAll();
        if (!initial.found) {
            statusTip.className = 'status-tip danger';
            statusTip.textContent = `⚠️ 初始组合无法满足目标，请调整设置或取消部分固定`;
        }

        targetDisplay.addEventListener('click', editTargetCalorie);
        shakeBtn.addEventListener('click', shakeAndGenerate);
        exportBtn.addEventListener('click', exportData);

        settingsBtn.addEventListener('click', () => {
            syncSettingsUI();
            settingsOverlay.classList.add('active');
        });
        settingsSave.addEventListener('click', () => {
            applySettingsFromUI();
            settingsOverlay.classList.remove('active');
        });
        setAllUnlimited.addEventListener('click', setAllUnlimitedClick);
        settingsOverlay.addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
            }
        });
        document.querySelectorAll('.settings-option').forEach(opt => {
            opt.addEventListener('click', function(e) {
                const parent = this.closest('.settings-options');
                if (!parent) return;
                parent.querySelectorAll('.settings-option').forEach(o => o.classList.remove('active'));
                this.classList.add('active');
                const radio = this.querySelector('input[type="radio"]');
                if (radio) radio.checked = true;
            });
        });
    }

    init();
</script>
</body>
</html>
